<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>BP1P Directory Console</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui;background:#080b12;color:#eef2ff}body{margin:0;background:radial-gradient(circle at 20% 0,#17213a 0,#080b12 44%);min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:38px 22px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-weight:800;font-size:26px}.sub{color:#9ba8bf}.card{background:#0e1421;border:1px solid #273146;border-radius:18px;padding:18px;margin-top:20px;box-shadow:0 18px 50px #0005}input,button{font:inherit;border-radius:10px;border:1px solid #33405a;background:#121a2a;color:#fff;padding:11px 13px}button{cursor:pointer;background:#5b7cff;border-color:#6d8aff;font-weight:700}.danger{background:#41202a;border-color:#7e3546}.row{display:flex;gap:10px;flex-wrap:wrap}.node{padding:14px 0;border-top:1px solid #202b3e}.pill{padding:4px 8px;border:1px solid #35425a;border-radius:999px;font-size:12px;color:#b8c5db}.ok{color:#7fe6ad}.pending{color:#ffd27a}code{color:#a9bfff}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">BP1P Directory Console</div><div class="sub">Approve and revoke nodes. The public manifest is signed automatically.</div><div class="sub" style="margin-top:6px">Client directory URL: <code id="clientUrl">http://localhost:8080</code></div></div><span class="pill">BP1P/2</span></div><div class="card"><div class="row"><input id="token" type="password" value="1" placeholder="Admin token" style="min-width:280px"><button id="unlock">Unlock</button></div><div id="out" class="sub" style="margin-top:14px">Enter the directory admin token.</div></div></div><script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path,opt={}){opt.headers={...(opt.headers||{}),authorization:'Bearer '+$('#token').value,'content-type':'application/json'};const r=await fetch(path,opt);const j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j}
async function load(){try{const j=await api('/admin/api/nodes');const out=$('#out');out.innerHTML='<b>Directory key:</b> <code>'+esc(j.keyId)+'</code><br><br>';if(!j.nodes.length){out.insertAdjacentHTML('beforeend','No nodes yet.');return}for(const n of j.nodes){const row=document.createElement('div');row.className='node';row.innerHTML='<div class="row" style="justify-content:space-between"><div><b>'+esc(n.name)+'</b> <span class="pill '+(n.status==='approved'?'ok':'pending')+'">'+esc(n.status)+'</span><div class="sub">'+esc(n.url)+' · '+esc(n.id)+' · '+(n.apps?.length||0)+' apps</div></div><div class="row node-actions"></div></div>';const actions=row.querySelector('.node-actions');if(n.status!=='approved'){const approve=document.createElement('button');approve.textContent='Approve';approve.dataset.nodeId=n.id;approve.dataset.action='approve';actions.appendChild(approve)}const revoke=document.createElement('button');revoke.className='danger';revoke.textContent='Revoke';revoke.dataset.nodeId=n.id;revoke.dataset.action='revoke';actions.appendChild(revoke);out.appendChild(row)}}catch(e){$('#out').textContent=e.message}}
async function act(id,action){await api('/admin/api/nodes/'+encodeURIComponent(id)+'/'+action,{method:'POST',body:'{}'});await load()}
$('#unlock').addEventListener('click',load);$('#token').addEventListener('keydown',e=>{if(e.key==='Enter')load()});$('#out').addEventListener('click',e=>{const b=e.target.closest('button[data-node-id]');if(b)act(b.dataset.nodeId,b.dataset.action)});
</script></body></html>
