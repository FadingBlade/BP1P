<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>BP1P Node Console</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui}body{margin:0;background:radial-gradient(circle at 12% 0,#1c2946,#080b12 45%);color:#eef2ff;min-height:100vh}.w{max-width:1000px;margin:auto;padding:36px 22px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:27px;font-weight:850}.muted{color:#99a8c2}.card{background:#0f1624;border:1px solid #28354d;border-radius:18px;padding:18px;margin-top:18px;box-shadow:0 16px 50px #0005}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea,button{box-sizing:border-box;width:100%;padding:11px 12px;border-radius:10px;border:1px solid #34435f;background:#111a2b;color:#fff;font:inherit}button{background:#5b7cff;border-color:#7893ff;font-weight:750;cursor:pointer}.danger{background:#45202c;border-color:#843a4e}.app{border-top:1px solid #253149;padding:14px 0}.actions{display:flex;gap:8px}.actions button{width:auto}.pill{border:1px solid #3a4863;border-radius:999px;padding:4px 8px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="top"><div><div class="logo">BP1P Node</div><div class="muted">Proxy applications · identity · registration</div></div><span class="pill">BP1P/2</span></div><div class="card"><input id="token" type="password" value="1" placeholder="Node admin token"><button id="unlock" style="margin-top:8px">Unlock console</button><div id="status" class="muted" style="margin-top:12px">Enter your token.</div></div><div id="main" hidden><div class="card"><h3>Add proxy application</h3><div class="grid"><input id="name" placeholder="Display name"><input id="id" placeholder="App ID (example)"></div><input id="target" style="margin-top:10px" placeholder="https://example.com"><textarea id="desc" style="margin-top:10px" placeholder="Description"></textarea><button id="add" style="margin-top:10px">Add application</button></div><div class="card"><h3>Applications</h3><div id="apps"></div></div></div></div><script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,o={}){o.headers={...(o.headers||{}),authorization:'Bearer '+$('#token').value,'content-type':'application/json'};const r=await fetch(p,o);const j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j}
async function load(){try{const j=await api('/admin/api/state');$('#main').hidden=false;$('#status').innerHTML='<b>'+esc(j.name)+'</b> · <span class="pill">'+esc(j.id)+'</span> · directory: '+esc(j.directoryStatus);const box=$('#apps');box.innerHTML='';if(!j.apps.length){box.innerHTML='<span class="muted">No applications.</span>';return}for(const a of j.apps){const row=document.createElement('div');row.className='app';row.innerHTML='<b>'+esc(a.name)+'</b><div class="muted">'+esc(a.id)+' → '+esc(a.target)+'</div><div class="actions" style="margin-top:8px"><button class="danger delete-app" type="button">Delete</button></div>';row.querySelector('.delete-app').dataset.appId=a.id;box.appendChild(row)}}catch(x){$('#status').textContent=x.message}}
async function add(){try{await api('/admin/api/apps',{method:'POST',body:JSON.stringify({name:$('#name').value,id:$('#id').value,target:$('#target').value,description:$('#desc').value,enabled:true})});$('#name').value=$('#id').value=$('#target').value=$('#desc').value='';await load()}catch(x){$('#status').textContent=x.message}}
async function del(id){if(confirm('Delete '+id+'?')){await api('/admin/api/apps/'+encodeURIComponent(id),{method:'DELETE'});await load()}}
$('#unlock').addEventListener('click',load);$('#add').addEventListener('click',add);$('#token').addEventListener('keydown',e=>{if(e.key==='Enter')load()});$('#apps').addEventListener('click',e=>{const b=e.target.closest('.delete-app');if(b)del(b.dataset.appId)});
</script></body></html>
