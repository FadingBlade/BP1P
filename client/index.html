<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BP1P</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101216;color:#edf1f7}body{margin:0}main{max-width:920px;margin:40px auto;padding:0 18px}.card{background:#171a21;border:1px solid #2c3340;border-radius:14px;padding:18px;margin:14px 0}select,button,input{font:inherit;padding:10px;border-radius:9px;border:1px solid #3b4556;background:#0e1117;color:inherit}button{cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap}.grow{flex:1}.muted{color:#aeb8c6;font-size:.92rem}iframe{width:100%;height:70vh;border:1px solid #2c3340;border-radius:14px;background:white}#status{white-space:pre-wrap}
</style>
</head>
<body><main>
<h1>BP1P</h1>
<p class="muted">Blade Protocol 1 Proxy — configured application relay over WebRTC.</p>
<div class="card">
  <div class="row"><select id="node" class="grow"></select><select id="app" class="grow"></select><button id="refresh">Refresh</button><button id="connect">Connect</button></div>
  <p id="status" class="muted">Loading nodes…</p>
</div>
<iframe id="view" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-downloads"></iframe>
<script type="module">
const $ = s => document.querySelector(s);
const nodeSel=$('#node'), appSel=$('#app'), status=$('#status'), view=$('#view');
const directory=location.origin;
let nodes=[], pc=null, dc=null;
const pending=new Map();

function setStatus(s){status.textContent=s}
function appsForNode(){return nodes.find(n=>n.id===nodeSel.value)?.apps||[]}
function refreshApps(){appSel.innerHTML=''; for(const a of appsForNode()){const o=document.createElement('option');o.value=a.id;o.textContent=a.name||a.id;appSel.append(o)}}
async function refresh(){
  const r=await fetch(directory+'/api/nodes',{cache:'no-store'}); const j=await r.json(); nodes=j.nodes||[];
  nodeSel.innerHTML=''; for(const n of nodes){const o=document.createElement('option');o.value=n.id;o.textContent=`${n.name} (${n.region})`;nodeSel.append(o)}
  refreshApps(); setStatus(nodes.length?`${nodes.length} node(s) available.`:'No nodes are currently online.');
}
nodeSel.addEventListener('change',refreshApps); $('#refresh').onclick=()=>refresh().catch(e=>setStatus(e.message));

function waitIce(pc){if(pc.iceGatheringState==='complete')return Promise.resolve();return new Promise(resolve=>{const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);resolve()}};pc.addEventListener('icegatheringstatechange',f)})}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode(...u.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const x=atob(s),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u}

async function connect(){
  if(!nodeSel.value||!appSel.value) throw new Error('Choose a node and app.');
  view.removeAttribute('src'); if(pc)pc.close(); pending.clear();
  pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  dc=pc.createDataChannel('bp1p',{ordered:true}); dc.binaryType='arraybuffer';
  dc.onopen=()=>setStatus('Connected. Launching application…');
  dc.onclose=()=>setStatus('Connection closed.');
  dc.onerror=e=>setStatus('Data channel error: '+(e.message||'unknown'));
  dc.onmessage=ev=>{
    let m; try{m=JSON.parse(typeof ev.data==='string'?ev.data:new TextDecoder().decode(ev.data))}catch{return}
    const p=pending.get(m.id); if(!p)return;
    if(m.t==='res_start'){p.status=m.status;p.headers=m.headers||{};p.chunks=[]}
    else if(m.t==='res_chunk')p.chunks.push(unb64(m.data));
    else if(m.t==='res_end'){let len=p.chunks.reduce((n,c)=>n+c.length,0),all=new Uint8Array(len),off=0;for(const c of p.chunks){all.set(c,off);off+=c.length}pending.delete(m.id);p.resolve({status:p.status,headers:p.headers,body:all.buffer})}
    else if(m.t==='error'){pending.delete(m.id);p.reject(new Error(m.message||'BP1P error'))}
  };
  const offer=await pc.createOffer(); await pc.setLocalDescription(offer); await waitIce(pc);
  const sr=await fetch(directory+'/api/sessions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nodeId:nodeSel.value,appId:appSel.value,offer:pc.localDescription})});
  if(!sr.ok)throw new Error('Could not create BP1P session: '+await sr.text()); const {id}=await sr.json();
  let answer=null; for(let i=0;i<60;i++){const ar=await fetch(`${directory}/api/sessions/${encodeURIComponent(id)}/answer`,{cache:'no-store'});if(ar.status===200){answer=(await ar.json()).answer;break}await sleep(500)}
  if(!answer)throw new Error('Node did not answer signaling request.'); await pc.setRemoteDescription(answer);
  await new Promise((resolve,reject)=>{if(dc.readyState==='open')return resolve();const t=setTimeout(()=>reject(new Error('WebRTC connection timed out.')),15000);dc.addEventListener('open',()=>{clearTimeout(t);resolve()},{once:true})});
  const reg=await navigator.serviceWorker.register('/bp1p-sw.js',{scope:'/'}); await navigator.serviceWorker.ready;
  if(!navigator.serviceWorker.controller){location.reload();return}
  navigator.serviceWorker.addEventListener('message', async ev=>{
    const m=ev.data;if(!m||m.type!=='BP1P_FETCH')return;
    try{
      const result=await remoteFetch(m.request);
      navigator.serviceWorker.controller.postMessage({type:'BP1P_FETCH_RESULT',id:m.id,ok:true,result:{status:result.status,headers:result.headers,body:result.body}},[result.body]);
    }catch(e){navigator.serviceWorker.controller.postMessage({type:'BP1P_FETCH_RESULT',id:m.id,ok:false,error:String(e.message||e)})}
  });
  navigator.serviceWorker.controller.postMessage({type:'BP1P_BRIDGE_READY'});
  view.src=`/__bp1p__/${encodeURIComponent(appSel.value)}/`;
}

function remoteFetch(req){
  return new Promise((resolve,reject)=>{
    if(!dc||dc.readyState!=='open')return reject(new Error('BP1P channel is not connected.'));
    const id=crypto.randomUUID(); pending.set(id,{resolve,reject,status:502,headers:{},chunks:[]});
    dc.send(JSON.stringify({t:'req',id,app:req.app,method:req.method,path:req.path,headers:req.headers,body:req.body?b64(req.body):''}));
    setTimeout(()=>{const p=pending.get(id);if(p){pending.delete(id);reject(new Error('BP1P request timed out.'))}},30000);
  });
}

$('#connect').onclick=()=>connect().catch(e=>setStatus(e.stack||e.message));
refresh().catch(e=>setStatus(e.message));
</script>
</main></body></html>
