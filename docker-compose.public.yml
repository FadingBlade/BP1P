services:
  directory:
    build:
      context: .
      dockerfile: directory/Dockerfile
    restart: unless-stopped
    environment:
      BP1P_PUBLIC_BASE_URL: https://${BP1P_DIRECTORY_HOST}
      BP1P_ADMIN_TOKEN: ${BP1P_DIRECTORY_ADMIN_TOKEN}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - bp1p-directory-data:/data

  node:
    build:
      context: .
      dockerfile: node/Dockerfile
    restart: unless-stopped
    depends_on:
      - directory
    environment:
      BP1P_DIRECTORY_URL: http://directory:8080
      BP1P_PUBLIC_URL: https://${BP1P_NODE_HOST}
      BP1P_NODE_NAME: ${BP1P_NODE_NAME:-BP1P Node}
      BP1P_ADMIN_TOKEN: ${BP1P_NODE_ADMIN_TOKEN}
      BP1P_ALLOW_PRIVATE_UPSTREAMS: ${BP1P_ALLOW_PRIVATE_UPSTREAMS:-false}
    expose:
      - "8081"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - bp1p-node-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - directory
      - node
    environment:
      BP1P_DIRECTORY_HOST: ${BP1P_DIRECTORY_HOST}
      BP1P_NODE_HOST: ${BP1P_NODE_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  bp1p-directory-data:
  bp1p-node-data:
  caddy-data:
  caddy-config:
