services:
  directory:
    build:
      context: .
      dockerfile: directory/Dockerfile
    restart: unless-stopped
    environment:
      BP1P_PUBLIC_BASE_URL: ${BP1P_DIRECTORY_PUBLIC_URL:-http://localhost:8080}
      BP1P_ADMIN_TOKEN: ${BP1P_DIRECTORY_ADMIN_TOKEN:-bp1p-local-directory-admin}
    ports:
      - "8080:8080"
      - "127.0.0.1:8790:8790"
    volumes:
      - bp1p-directory-data:/data

  node:
    build:
      context: .
      dockerfile: node/Dockerfile
    restart: unless-stopped
    depends_on:
      - directory
    environment:
      BP1P_DIRECTORY_URL: ${BP1P_DIRECTORY_URL:-http://directory:8080}
      BP1P_PUBLIC_URL: ${BP1P_NODE_PUBLIC_URL:-http://localhost:8081}
      BP1P_NODE_NAME: ${BP1P_NODE_NAME:-Local BP1P Node}
      BP1P_ADMIN_TOKEN: ${BP1P_NODE_ADMIN_TOKEN:-bp1p-local-node-admin}
      BP1P_ALLOW_PRIVATE_UPSTREAMS: ${BP1P_ALLOW_PRIVATE_UPSTREAMS:-false}
    ports:
      - "8081:8081"
      - "127.0.0.1:8787:8787"
    volumes:
      - bp1p-node-data:/data

volumes:
  bp1p-directory-data:
  bp1p-node-data:
